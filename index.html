<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta línea hace que se vea bien en el celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>que es estooooooo</title>

  <style>
    /* ===== COLORES Y FONDO ===== */
    body {
      margin: 0;
      min-height: 100vh;
      background: #10231a;            /* verde oscuro para que resalte el amarillo */
      color: #fff7d6;                 /* crema */
      font-family: Georgia, serif;
      text-align: center;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #ffd93d;                 /* amarillo */
      font-size: 2rem;
      margin: 0 0 5px 0;
    }

    .fecha {
      margin: 0 0 20px 0;
      color: #c8e6a0;                 /* verde clarito */
    }

    /* ===== LA FLOR GRANDE DEL CENTRO ===== */
    .flor {
      font-size: 110px;
      animation: florecer 3s ease-out, latido 4s ease-in-out 3s infinite;
    }

    /* la flor empieza chiquita y va creciendo mientras gira */
    @keyframes florecer {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);    opacity: 1; }
    }

    /* después queda "respirando" suavecito */
    @keyframes latido {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    /* ===== CAJA DEL MENSAJE ===== */
    .mensaje {
      background: rgba(255, 217, 61, 0.12);
      border: 2px solid #ffd93d;
      border-radius: 20px;
      padding: 20px;
      max-width: 320px;
      margin-top: 20px;
      font-size: 1.2rem;
      font-style: italic;
      line-height: 1.5;
    }

    /* ===== BOTÓN ===== */
    button {
      margin-top: 20px;
      background: #ffd93d;
      color: #10231a;
      border: none;
      border-radius: 25px;
      padding: 12px 25px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* ===== PÉTALOS QUE CAEN ===== */
    .petalo {
      position: fixed;
      top: -50px;
      pointer-events: none;          /* para que no estorben al tocar */
      animation: caer linear forwards;
    }

    @keyframes caer {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>

<body>

  <!-- EDITA TU TÍTULO AQUÍ -->
  <h1>Feliz día de las flores amarillas</h1>

  <!-- EDITA LA FECHA AQUÍ -->
  <p class="fecha">21 de septiembre</p>

  <div class="flor">🌻</div>

  <!-- AQUÍ SE MUESTRA LA FRASE (se cambia con el botón, las frases se editan abajo en el script) -->
  <div class="mensaje" id="mensaje">
    Las flores amarillas no piden nada, solo florecer. Y aun así iluminan todo, igual que tú.
  </div>

  <!-- EDITA EL TEXTO DEL BOTÓN AQUÍ -->
  <button onclick="cambiarFrase()">Otra frase 🌼</button>

  <script>
    // ======================================================
    // EDITA TUS FRASES AQUÍ
    // Cada frase va entre comillas y separada por una coma.
    // Puedes agregar o quitar frases, solo no borres los corchetes [ ]
    // ======================================================
    var frases = [
      "Las flores amarillas no piden nada, solo florecer, Y aun así iluminan todo, igual que tú.",
      "El amarillo representa alegria, pero desde que llegaste tu, se exactamente de donde viene la mia.",
      "Quizá no pueda ponerla en tus manos, pero si puedo ponerlo en tu contacto.",
      "Byee~"
    ];

    var numero = 0; // aquí guardo cuál frase se está mostrando

    // Esta función se ejecuta cuando tocan el botón
    function cambiarFrase() {
      numero = numero + 1;
      if (numero >= frases.length) {
        numero = 0; // si ya no hay más frases, vuelve a la primera
      }
      document.getElementById("mensaje").textContent = frases[numero];
    }

    // ======================================================
    // PÉTALOS QUE CAEN
    // Puedes cambiar los emojis de esta lista
    // ======================================================
    var emojis = ["🌼", "🌻", "💛", "🌼"];

    function crearPetalo() {
      var petalo = document.createElement("span");
      petalo.className = "petalo";
      petalo.textContent = emojis[Math.floor(Math.random() * emojis.length)];

      petalo.style.left = Math.random() * 95 + "vw";                    // posición horizontal al azar
      petalo.style.fontSize = (15 + Math.random() * 20) + "px";          // tamaño al azar
      var duracion = 5 + Math.random() * 5;                              // entre 5 y 10 segundos
      petalo.style.animationDuration = duracion + "s";

      document.body.appendChild(petalo);

      // borro el pétalo cuando termina de caer para que el celular no se ponga lento
      setTimeout(function () {
        petalo.remove();
      }, duracion * 1000);
    }

    // crea un pétalo nuevo cada 0.6 segundos
    setInterval(crearPetalo, 600);
  </script>

</body>
</html>
